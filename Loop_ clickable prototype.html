<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loop: clickable prototype</title>
<style>
:root{--bg:#EDEAF4;--surf:#fff;--card:#F3F0F8;--ink:#1F1B2E;--mute:#6B6584;--line:#D9D4E7;--co:#FF6B4A;--vi:#7C5CFF;--mi:#1E9C85;--am:#B7791F;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120F1C;--surf:#1B1729;--card:#262038;--ink:#F1EEF8;--mute:#A29CB8;--line:#383152;--mi:#3DD1B6;--am:#F5B83D}}
:root[data-theme="dark"]{--bg:#120F1C;--surf:#1B1729;--card:#262038;--ink:#F1EEF8;--mute:#A29CB8;--line:#383152;--mi:#3DD1B6;--am:#F5B83D}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 Calibri,"Segoe UI",Arial,sans-serif;display:flex;justify-content:center;align-items:center}
.app{width:100%;max-width:400px;height:100%;max-height:760px;background:var(--surf);display:flex;flex-direction:column;position:relative;overflow:hidden;border-radius:0}
@media (min-width:520px){.app{border-radius:28px;box-shadow:0 8px 40px rgba(31,27,46,.25);height:min(760px,94vh)}}
h1,h2{font-family:Cambria,Georgia,serif;margin:0}
header{padding:18px 18px 6px}
header h1{font-size:26px}
header p{margin:2px 0 0;color:var(--mute);font-size:13px}
main{flex:1;overflow-y:auto;padding:8px 16px 16px}
nav{display:flex;border-top:1px solid var(--line);background:var(--surf)}
nav button{flex:1;padding:12px 4px;border:0;background:none;color:var(--mute);font:inherit;font-size:13px;cursor:pointer}
nav button[aria-current="page"]{color:var(--co);font-weight:700}
button{font:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--vi);outline-offset:2px}
.card{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:12px;margin:10px 0;width:100%;border:0;color:inherit;text-align:left;cursor:pointer}
.thumb{width:44px;height:56px;border-radius:8px;flex:none;background:linear-gradient(135deg,var(--line),var(--card));border:1px solid var(--line)}
.card b{display:block;font-size:15px}.card span.s{color:var(--mute);font-size:13px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px;color:var(--on);background:var(--co);margin-top:4px}
.tag.vi{background:var(--vi)}.tag.mi{background:var(--mi);color:#08201B}.tag.gr{background:var(--mute)}
.sec{font-size:13px;color:var(--mute);margin:16px 0 0;font-weight:700}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;background:var(--co);color:#1F1B2E;font-weight:700;cursor:pointer;margin-top:10px}
.btn.alt{background:var(--card);color:var(--ink)}
.link{background:none;border:0;color:var(--vi);text-decoration:underline;cursor:pointer;padding:8px;width:100%;margin-top:4px}
.scrim{position:absolute;inset:0;background:rgba(10,8,20,.55);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--surf);width:100%;border-radius:22px 22px 0 0;padding:18px;max-height:92%;overflow-y:auto}
.shot{position:relative;height:150px;border-radius:12px;background:linear-gradient(160deg,var(--line),var(--card));margin:10px 0;border:1px solid var(--line)}
.hl{position:absolute;border:2px solid var(--co);border-radius:4px;background:rgba(255,107,74,.12)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--mi)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 13px;cursor:pointer}
.toast{position:absolute;left:14px;right:14px;bottom:70px;background:#1F1B2E;color:#fff;border-radius:12px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;z-index:9}
.toast button{background:none;border:0;color:#F5B83D;font-weight:700;cursor:pointer}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.ph{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:0;color:inherit;cursor:pointer;overflow:hidden;text-align:left}
.ph .img{height:150px;background:linear-gradient(150deg,#7C5CFF55,#FF6B4A55)}
.ph.b .img{filter:blur(3px)}
.ph div.t{padding:8px 10px;font-size:13px}
.ph.pick{border-color:var(--mi)}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;margin-bottom:6px}
.seg button{flex:1;border:0;background:none;color:var(--mute);padding:8px;border-radius:10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surf);color:var(--ink);font-weight:700}
.big{font-family:Cambria,Georgia,serif;font-size:40px}
input{width:100%;padding:12px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:99px;padding:5px 12px;cursor:pointer}
.m{color:var(--mute);font-size:13px}
</style></head>
<body>
<div class="app" id="app">
<header><h1 id="ttl"></h1><p id="sub"></p></header>
<main id="main"></main>
<nav id="nav"></nav>
</div>
<script>
const $=s=>document.querySelector(s);
const INTENT={register:{l:"Register",a:"Open registration page",done:"Registered"},book:{l:"Book",a:"Open ticket page",done:"Booked"},pay:{l:"Pay",a:"Pay with UPI",done:"Paid"},ref:{l:"Reference",a:"Keep as reference",done:"Filed"}};
let cards=[
 {id:1,t:"Wire Wars registration",s:"closes in 3 days",i:"register",c:92,read:["Last date: 22 Nov","Register here: link found"],hl:[[12,18,70,20],[12,60,55,20]]},
 {id:2,t:"Concert presale",s:"ends Friday",i:"book",c:88,read:["Presale: Fri, 8 pm","Tickets link found"],hl:[[12,30,65,20],[12,70,50,20]]},
 {id:3,t:"Pay ₹450 to Aarav",s:"saved 12 days ago",i:"pay",c:95,read:["UPI QR code detected","Amount: ₹450"],hl:[[30,20,40,60]]},
 {id:4,t:"Not sure what this is",s:"you decide",i:null,c:58,read:["Menu photo, no date or link"],hl:[[10,10,80,30]]}];
let done=[],view="needs",tab="tidy",sheet=null,reclass=false,toast=null,tt;
const pairs=[
 {n:"Birthday dinner",a:{l:"Sharp, eyes open",pick:1},b:{l:"Blurry, eyes closed",blur:1},extra:7,mb:38,choice:null},
 {n:"Beach sunset",a:{l:"Slightly tilted"},b:{l:"Level, better light",pick:1},extra:11,mb:54,choice:null},
 {n:"Festival greetings",a:{l:"Unique design",pick:1},b:{l:"14 near-identical forwards",blur:1},extra:13,mb:96,choice:null}];
let pi=0,hold=[];
const asks={"restaurant riya mentioned":{t:"Saved 9 Nov, from chat",d:"Café Zoya, Sardarpura",acts:["Navigate","Call","Add to Needs You"]},"wi-fi password":{t:"Saved 2 Oct",d:"Hostel Wi-Fi: password in image",acts:["Copy text"]},"concert ticket":{t:"Saved 4 Nov",d:"Presale ends Friday",acts:["Open Needs You card"]}};
function say(m,undo){clearTimeout(tt);toast={m,undo};draw();tt=setTimeout(()=>{toast=null;draw()},4500)}
function complete(c){cards=cards.filter(x=>x.id!==c.id);done.push(c);sheet=null;reclass=false;say(INTENT[c.i].done+". Screenshot archived as Done.",()=>{done=done.filter(x=>x.id!==c.id);cards.unshift(c);toast=null;draw()})}
function draw(){
 $("#ttl").textContent={needs:"Needs You",mem:"Memories",ask:"Ask"}[view];
 $("#sub").textContent={needs:cards.length?cards.length+" things waiting. Nothing leaves your phone.":"All caught up.",mem:tab==="tidy"?"Weekly tidy: you choose, AI suggests.":"Nothing is deleted for 30 days.",ask:"Search by what you meant."}[view];
 $("#nav").innerHTML=[["needs","Needs You"],["mem","Memories"],["ask","Ask"]].map(([k,l])=>`<button data-v="${k}" ${view===k?'aria-current="page"':""}>${l}</button>`).join("");
 $("#nav").onclick=e=>{const v=e.target.dataset.v;if(v){view=v;draw()}};
 const m=$("#main");
 if(view==="needs"){
  m.innerHTML=(cards.length?cards.map(c=>`<button class="card" data-o="${c.id}"><div class="thumb"></div><div><b>${c.t}</b><span class="s">${c.s}</span><br><span class="tag ${c.i?(c.i==="pay"?"mi":c.i==="book"?"vi":""):"gr"}">${c.i?INTENT[c.i].l:"Not sure"}</span></div></button>`).join(""):`<p class="m">Every saved screenshot is handled. Take a screenshot to see a new card.</p>`)
  +(done.length?`<p class="sec">Done (${done.length})</p>`+done.map(c=>`<div class="card" style="opacity:.55;cursor:default"><div class="thumb"></div><div><b>${c.t}</b><span class="s">${INTENT[c.i].done}</span></div></div>`).join(""):"");
  m.onclick=e=>{const b=e.target.closest("[data-o]");if(b){sheet=cards.find(x=>x.id==b.dataset.o);reclass=!sheet.i;draw()}};
 }
 if(view==="mem"){
  const seg=`<div class="seg"><button data-t="tidy" aria-pressed="${tab==="tidy"}">Tidy</button><button data-t="hold" aria-pressed="${tab==="hold"}">Holding Area (${hold.length})</button></div>`;
  let body="";
  if(tab==="tidy"){
   if(pi>=pairs.length){body=`<p class="big">Tidy done</p><p class="m">${hold.length} groups moved to the Holding Area. You can restore any of them.</p><button class="btn" data-t="hold">Open Holding Area</button>`}
   else{const p=pairs[pi];body=`<p class="sec">${p.n}: ${pi+1} of ${pairs.length}</p><p class="m">Tap the one to keep. AI’s suggestion is marked.</p><div class="pair">${["a","b"].map(k=>`<button class="ph ${p[k].blur?"b":""}" data-k="${k}"><div class="img"></div><div class="t">${p[k].pick?'<span class="tag mi">AI pick</span><br>':""}${p[k].l}</div></button>`).join("")}</div><p class="m">Why: ${p.a.pick?"sharper and eyes open":p.b.pick?"better light and level horizon":"it is the only original"}. ${p.extra} more similar shots will move with the loser.</p><button class="btn alt" data-k="both">Keep both</button>`}
   }else{
   const mb=hold.reduce((s,h)=>s+h.mb,0),n=hold.reduce((s,h)=>s+h.extra+1,0);
   body=hold.length?`<p class="big">${n} items</p><p class="m">${mb} MB freed. Auto-clears in 30 days, with a reminder first.</p>`+hold.map((h,i)=>`<div class="row"><div><b>${h.n}</b><br><span class="m">${h.extra+1} items, ${h.mb} MB</span></div><button data-r="${i}">Restore</button></div>`).join("")+`<button class="btn alt" data-r="all">Restore all</button>`:`<p class="m">Nothing here. Finish a tidy and removed photos wait here for 30 days.</p>`}
  m.innerHTML=seg+body;
  m.onclick=e=>{const t=e.target.closest("[data-t]"),k=e.target.closest("[data-k]"),r=e.target.closest("[data-r]");
   if(t){tab=t.dataset.t;draw()}
   if(k){const p=pairs[pi],w=k.dataset.k;if(w!=="both")hold.push({n:p.n,extra:p.extra,mb:p.mb});pi++;say(w==="both"?"Kept both.":"Moved to Holding Area.",w==="both"?null:()=>{hold.pop();pi--;toast=null;draw()})}
   if(r){const v=r.dataset.r;if(v==="all")hold=[];else hold.splice(+v,1);say("Restored to your gallery.");}};
 }
 if(view==="ask"){
  m.innerHTML=`<input id="q" placeholder="Try: restaurant Riya mentioned" aria-label="Search"><div class="chips">${Object.keys(asks).map(k=>`<button class="chip" data-q="${k}">${k}</button>`).join("")}</div><div id="res"></div>`;
  const run=v=>{const k=Object.keys(asks).find(x=>v.trim()&&(x.includes(v.toLowerCase().trim())||v.toLowerCase().includes(x.split(" ")[0])));$("#res").innerHTML=!v.trim()?"":k?`<div class="card" style="cursor:default"><div class="thumb"></div><div><b>${asks[k].d}</b><span class="s">${asks[k].t}</span></div></div><div class="chips">${asks[k].acts.map(a=>`<button class="chip" data-a="${a}">${a}</button>`).join("")}</div>`:`<p class="m">No match. Try one of the examples above.</p>`};
  $("#q").oninput=e=>run(e.target.value);
  m.onclick=e=>{const q=e.target.closest("[data-q]"),a=e.target.closest("[data-a]");if(q){$("#q").value=q.dataset.q;run(q.dataset.q)}if(a)say(a.dataset.a==="Add to Needs You"?"Added to Needs You.":a.dataset.a+" (demo action)")};
 }
 const old=$("#ov");if(old)old.remove();
 if(sheet){const c=sheet,d=document.createElement("div");d.className="scrim";d.id="ov";
  d.innerHTML=`<div class="sheet" role="dialog" aria-label="${c.t}"><h2>${c.t}</h2><p class="m">${c.s}</p><div class="shot">${c.hl.map(h=>`<div class="hl" style="left:${h[0]}%;top:${h[1]}%;width:${h[2]}%;height:${h[3]}px"></div>`).join("")}</div><b>What the AI read</b><ul style="margin:6px 0;padding-left:18px">${c.read.map(r=>`<li>${r}</li>`).join("")}</ul><span class="m">Confidence: ${c.c}%. Read on this device.</span><div class="bar"><i style="width:${c.c}%"></i></div>${reclass?`<b>${c.i?"What did you mean?":"What is this for?"}</b><div class="chips">${Object.entries(INTENT).map(([k,v])=>`<button class="chip" data-i="${k}">${v.l}</button>`).join("")}</div>`:`<button class="btn" id="go">${INTENT[c.i].a}</button><button class="link" id="nm">Not what I meant?</button>`}<button class="link" id="cl" style="color:var(--mute)">Close</button></div>`;
  $("#app").appendChild(d);
  d.onclick=e=>{if(e.target===d){sheet=null;reclass=false;draw()}};
  const g=d.querySelector("#go");if(g)g.onclick=()=>complete(c);
  const nm=d.querySelector("#nm");if(nm)nm.onclick=()=>{reclass=true;draw()};
  d.querySelector("#cl").onclick=()=>{sheet=null;reclass=false;draw()};
  d.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{c.i=b.dataset.i;c.c=100;c.read=["You confirmed: "+INTENT[c.i].l];reclass=false;say("Got it. Learned on this device.");});
 }
 const ot=$("#tst");if(ot)ot.remove();
 if(toast){const t=document.createElement("div");t.className="toast";t.id="tst";t.setAttribute("role","status");t.innerHTML=`<span>${toast.m}</span>${toast.undo?'<button>Undo</button>':""}`;$("#app").appendChild(t);if(toast.undo)t.querySelector("button").onclick=toast.undo}
}
draw();
</script></body></html>
